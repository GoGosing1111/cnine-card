<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>장비 연마 · 리버스콜</title>
  <link rel="stylesheet" href="/css/equipment-icons-20261114.css">
  <link rel="stylesheet" href="/equipment-polish/live.css?v=20261114-font2">
  <link rel="preload" as="image" href="/assets/ui/equipment-polish-20261114/icons.webp">
</head>
<body>
  <main class="atelier">
    <header class="masthead">
      <a href="/?screen=character" class="back-link"><span class="ep-icon" data-icon="attack" aria-hidden="true"></span>장비 관리</a>
      <a href="/equipment-forge/">장비 강화</a>
      <a id="polish-cms-link" href="/admin/#equipment-polish" hidden>연마 설정</a>
    </header>
    <div class="page-heading"><h1>장비 연마</h1><p>연마석에 담긴 힘으로 장비의 잠재력을 깨우세요.</p></div>
    <section id="access-gate"><p id="access-message" role="status">보유 장비를 불러오는 중입니다.</p><button id="retry-access" hidden>다시 불러오기</button></section>
    <div id="workbench" hidden>
      <section class="equipment-picker" aria-label="연마 대상">
        <img id="equipment-image" alt="" width="72" height="72" hidden>
        <div class="equipment-choice"><label for="equipment-select">연마할 장비</label><select id="equipment-select"></select><p id="equipment-detail"></p></div>
        <button id="equipment-more" class="quiet-button" hidden>장비 더 불러오기</button>
        <button id="refresh" class="quiet-button">새로고침</button>
      </section>
      <div class="workbench-layout">
        <section class="polish-stage" aria-label="연마 룰렛">
          <div class="probability"><span>성공 <strong id="success-rate">—</strong></span><span>꽝 <b id="miss-rate">—</b></span></div>
          <div class="reel-scene" id="reel-scene">
            <span class="ep-icon reel-marker" data-icon="polish-stone" aria-hidden="true"></span>
            <div class="reel-window" id="reel-window" aria-hidden="true"><div class="reel-track" id="reel-track"></div></div>
            <div class="result" id="result" hidden><span id="result-icon" class="ep-icon" aria-hidden="true"></span><h2 id="result-title"></h2><p id="result-detail"></p></div>
          </div>
          <p class="phase" id="phase" role="status" aria-live="polite" aria-atomic="true">연마를 시작하면 룰렛이 돌아갑니다.</p>
          <div class="costs" id="costs" aria-label="1회 소모 재료"></div>
          <button class="start-button" id="start" disabled><span class="ep-icon" data-icon="polish-stone" aria-hidden="true"></span><span id="start-label">연마 시작</span></button>
          <p class="cost-note">성공과 꽝 모두 표시된 재료를 소모합니다.</p>
          <p id="live-message" class="live-message" role="status" aria-live="polite"></p>
        </section>
        <section class="growth-panel" aria-labelledby="growth-heading">
          <div class="growth-heading"><h2 id="growth-heading">장비 옵션</h2><span id="growth-count"></span></div>
          <div class="option-column-labels"><span>현재 효과</span><span>획득 확률</span></div>
          <div id="options"></div>
          <p class="growth-note">성공 시 옵션 하나가 1단계 상승합니다.<br>최대 단계인 옵션은 추첨에서 제외됩니다.</p>
          <p id="live-note" class="growth-note"></p>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="/equipment-polish/app.mjs?v=20261114-buff1"></script>
</body>
</html>
