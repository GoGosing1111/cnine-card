<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Z-BODY · 번개 대쉬와 뇌검 집행</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#080e18;color:#eef2f8;font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:18px 24px;border-bottom:1px solid #3b352a;background:linear-gradient(110deg,#181a22,#0b1524)}
h1{margin:0;font-size:23px;letter-spacing:-1px}h1 small{display:block;color:#cfb779;font-size:10px;letter-spacing:3px;margin-bottom:3px;font-weight:500}
.intro{color:#aebbcf;font-size:12px;margin:0}.intro b{color:#e8d6a6}.badge{margin-left:auto;color:#cdbb91;font-size:11px;border:1px solid #594b31;padding:4px 10px;border-radius:20px}
.toolbar{padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px solid #263248}
button,select{min-height:38px;color:#cedbf0;background:#131f30;border:1px solid #344257;border-radius:5px;padding:8px 12px;font:inherit;cursor:pointer}
button:disabled{opacity:.4}button.primary{background:#d1b574;border-color:#d1b574;color:#111827;font-weight:800}button[aria-pressed=true]{color:#f4d89e;border-color:#a68950;background:#28231c}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #edd197;outline-offset:3px}.group{display:flex;gap:6px}.divider{height:24px;width:1px;background:#324052;margin:0 6px}
label{font-size:12px;color:#a6b8d0;display:flex;align-items:center;gap:6px}.meter{margin-left:auto;display:flex;gap:18px;color:#a8b7cb;font-size:11px}.meter b{font-size:14px;color:#f2deab;font-variant-numeric:tabular-nums}
iframe{width:100%;height:calc(100dvh - 248px);min-height:480px;border:0;display:block;background:#071322}
.strip{padding:10px 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid #293447}.strip button{font-size:12px;min-height:32px;padding:5px 10px}#state{color:#d4c098;margin-left:auto;font-size:12px}
details{padding:10px 24px;color:#8b9aaf;font-size:12px}summary{cursor:pointer}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.5 Consolas,monospace;max-height:300px;overflow:auto}
@media(max-width:600px){header{padding:13px 14px;gap:8px}h1{font-size:20px}.intro{width:100%;order:3}.badge{font-size:10px}.toolbar,.strip{padding:9px 12px;gap:6px}button,select{font-size:12px;padding:7px 10px}.divider{display:none}.meter{width:100%;margin:2px 0 0;justify-content:space-between}iframe{height:calc(100dvh - 330px);min-height:435px}.strip label{width:100%}.strip input{flex:1}#state{margin-left:0}}
</style></head><body>
<header><h1><small>Z-BODY / LIGHTNING STRIKE</small>청뢰의 검격</h1><p class="intro">번개 대쉬 · 전류 검격 · 접촉 방전<br><b>뇌검 집행: 적 전체 광역 / 적 1명당 헬기폭격 1회분</b></p><span class="badge">전체 승인 · 최종본</span></header>
<div class="toolbar"><label><select id="action" aria-label="연출 종류"><option value="normal">일반 대쉬·평타</option><option value="skill">뇌검 집행 · 승인본</option></select></label><div class="group"><button id="new" aria-pressed="true" disabled>새 연출</button><button id="old" aria-pressed="false" disabled>기존 연출</button></div><span class="divider"></span>
<button id="play" class="primary" disabled>재생</button><button id="pause" disabled>정지 / 재개</button><button id="stop" disabled>중단</button>
<label><select id="targets" aria-label="타격 대상"><option value="multi">적 5명</option><option value="single">적 1명</option></select></label>
<label><select id="speed" aria-label="재생 속도"><option value=".25">0.25×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
<div class="meter"><span>타격 <b id="hits">0 / 1</b></span><span>실제 피해 <b id="damage">0</b></span><span id="time">0.00s</span></div></div>
<iframe src="battle.html" title="실제 V3 전장 · Z바디 뇌검 광역기"></iframe>
<div class="strip"><button id="charge" disabled>준비</button><button id="contact" disabled>첫 충돌</button><button id="peak" disabled>검 궤적</button><button id="tail" disabled>소멸</button>
<label>시간 탐색 <input id="seek" type="range" min="0" max="640" step="5" value="245"></label><span id="state" aria-live="polite">전장 준비 중</span></div>
<details><summary>검수 기록 · 서버 피해 및 재생 상태</summary><p>기존 카드 원화·전투 SD·V3 진형을 사용한 로컬 검수입니다. 서버 시뮬레이션의 확정 피해를 재생하며 실제 계정·재화에는 반영하지 않습니다. 신규 사운드는 없습니다.</p><button id="verify" disabled>전체 서버 기록 검증</button><output id="verification"></output><output id="health"></output></details>
</body></html>
