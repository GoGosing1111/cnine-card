<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Burning Command UI · Live Contract Preview</title>
  <link rel="stylesheet" href="../../css/burning-event-v1871.css?v=1872-burning-layout">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#070a0f;color:#eef4f7;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif}button{font:inherit}.fixture-shell{--pc-hud-h:74px;position:relative;min-height:100dvh;background:linear-gradient(135deg,#071019,#090b11 55%,#10080b)}.fixture-header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #263440;background:#090d12}.fixture-header b{font-size:19px}.fixture-resources{display:flex;align-items:center;gap:8px}.fixture-resources span{min-width:108px;padding:8px 12px;border:1px solid #27333e;color:#dce6eb;background:#0c1219;font-size:11px;font-weight:800;letter-spacing:0}.fixture-stage{position:absolute;inset:74px 0 0;display:grid;place-items:center;padding:90px 24px 24px}.fixture-console{width:min(1040px,100%);padding:32px;border:1px solid #24323d;background:#0b1118}.fixture-console small{color:#7bd7e8;font-weight:900;letter-spacing:.15em}.fixture-console h1{margin:10px 0 8px;font-size:clamp(28px,4vw,52px)}.fixture-console p{max-width:640px;color:#8f9da7;line-height:1.7}.fixture-actions{display:flex;gap:8px;margin-top:24px}.fixture-actions button{min-height:44px;padding:0 16px;border:1px solid #40505d;border-radius:3px;color:#eaf3f7;background:#111a22;cursor:pointer}.fixture-actions button.active{border-color:#ff7b5f;color:#fff;background:#351016}.fixture-actions button[data-mode=hyper].active{border-color:#c78aff;background:#241038}@media(max-width:759px){.fixture-header{padding:0 12px}.fixture-resources span{min-width:0;padding:7px}.fixture-resources span:first-child{display:none}.fixture-stage{padding:76px 12px 12px}.fixture-console{padding:20px}.fixture-actions{display:grid;grid-template-columns:1fr 1fr}.fixture-actions button:last-child{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="fixture-shell game-frame" data-v21-shell="preview" data-route="home">
    <header class="fixture-header"><b>SOOPKETMON</b><span class="fixture-resources"><span>COIN 3.73B</span><span>CRYSTAL 95,295</span></span></header>
    <section id="burningEventHud" class="burning-event-hud is-burning" aria-label="BURNING 이벤트 진행 중">
      <button type="button" class="burning-event-hud-trigger" data-open aria-haspopup="dialog">
        <span class="burning-event-hud-ident"><i aria-hidden="true">B</i><span><small>LIVE EVENT</small><strong>BURNING</strong></span></span>
        <span class="burning-event-hud-boost"><small>COIN BOOST</small><b>×5</b></span>
        <span class="burning-event-hud-stats"><em><small>PVE</small><b>15</b></em><em><small>PVP</small><b>15</b></em><em><small>RECHARGE</small><b>2<i>분</i></b></em></span>
        <span class="burning-event-hud-open"><small>3시간 12분 남음</small><b>상세보기 <i aria-hidden="true">›</i></b></span>
      </button>
    </section>
    <section class="fixture-stage screen-viewport"><article class="fixture-console"><small>OPERATIONS PREVIEW</small><h1>버닝 이벤트 지휘 브리핑</h1><p>이 프리뷰는 라이브에 연결된 동일 CSS와 동일 DOM 계약을 사용합니다. 모드 전환 후 상단 이벤트 HUD를 누르거나 아래 버튼으로 팝업을 다시 확인할 수 있습니다.</p><div class="fixture-actions"><button type="button" data-mode="burning" class="active">버닝 · RED</button><button type="button" data-mode="hyper">하이퍼 버닝 · PURPLE</button><button type="button" data-open>브리핑 다시 열기</button></div></article></section>
  </main>
  <script>
    const state={mode:'burning'};
    const copy={burning:{label:'BURNING',mark:'B',headline:'전장 가속 프로토콜 발동',protocol:'COMBAT ACCELERATION',support:'숲켓몬 버닝이 발동 되었습니다',coin:'5',pve:'15',pvp:'15',minutes:'2'},hyper:{label:'HYPER BURNING',mark:'HB',headline:'하이퍼 드라이브 전면 개방',protocol:'OVERDRIVE PROTOCOL',support:'숲켓몬 하이퍼 버닝 진행 중',coin:'5',pve:'20',pvp:'30',minutes:'2'}};
    const hud=document.getElementById('burningEventHud');
    function setMode(mode){state.mode=mode;const data=copy[mode],hyper=mode==='hyper';hud.className=`burning-event-hud ${hyper?'is-hyper':'is-burning'}`;hud.setAttribute('aria-label',`${data.label} 이벤트 진행 중`);hud.querySelector('.burning-event-hud-ident i').textContent=data.mark;hud.querySelector('.burning-event-hud-ident strong').textContent=data.label;hud.querySelector('.burning-event-hud-boost b').textContent=`×${data.coin}`;const values=hud.querySelectorAll('.burning-event-hud-stats b');values[0].textContent=data.pve;values[1].textContent=data.pvp;values[2].innerHTML=`${data.minutes}<i>분</i>`;document.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===mode));}
    function openBriefing(){const data=copy[state.mode],hyper=state.mode==='hyper',el=document.createElement('div');el.className=`burning-activation-notice burning-command-notice ${hyper?'is-hyper':'is-burning'}`;el.innerHTML=`<article class="burning-briefing-panel" role="dialog" aria-modal="true" aria-labelledby="burningNoticeTitle" tabindex="-1"><div class="burning-briefing-art" aria-hidden="true"></div><div class="burning-briefing-grid" aria-hidden="true"></div><button type="button" class="burning-briefing-close" data-close aria-label="닫기">×</button><header class="burning-briefing-header"><span class="burning-briefing-kicker"><i>LIVE EVENT</i><b>${data.label}</b></span><small>${data.protocol}</small><h2 id="burningNoticeTitle">${data.headline}</h2><p>${data.support}</p></header><section class="burning-briefing-stats" aria-label="이벤트 효과"><article><small>COIN REWARD</small><b>×${data.coin}</b><span>전투 코인 보상</span></article><article><small>PVE ENERGY</small><b>${data.pve}<i>회</i></b><span>최대 행동력</span></article><article><small>PVP ENERGY</small><b>${data.pvp}<i>회</i></b><span>최대 행동력</span></article><article><small>RECHARGE</small><b>${data.minutes}<i>분</i></b><span>행동력 충전 주기</span></article></section><footer class="burning-briefing-footer"><span><small>EVENT STATUS</small><b>3시간 12분 남음</b></span><button type="button" class="burning-briefing-primary" data-close>확인<i aria-hidden="true">›</i></button></footer></article>`;document.body.append(el);document.documentElement.classList.add('burning-notice-open');document.body.classList.add('burning-notice-open');const onKey=event=>{if(event.key==='Escape')close()};const close=()=>{el.classList.remove('show');document.documentElement.classList.remove('burning-notice-open');document.body.classList.remove('burning-notice-open');document.removeEventListener('keydown',onKey);setTimeout(()=>el.remove(),240)};document.addEventListener('keydown',onKey);el.querySelectorAll('[data-close]').forEach(button=>button.onclick=close);el.onclick=event=>{if(event.target===el)close()};requestAnimationFrame(()=>{el.classList.add('show');el.querySelector('.burning-briefing-panel').focus()});}
    document.addEventListener('click',event=>{const mode=event.target.closest('[data-mode]')?.dataset.mode;if(mode)setMode(mode);if(event.target.closest('[data-open]'))openBriefing()});
    const query=new URL(location.href).searchParams;setMode(query.get('mode')==='hyper'?'hyper':'burning');setTimeout(openBriefing,180);
  </script>
</body>
</html>
