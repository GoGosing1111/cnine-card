<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SX슈트 · 원본과 동작 비교</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#081124;color:#d6e6ff;font:14px/1.5 system-ui,'Malgun Gothic',sans-serif}header{padding:22px 26px;border-bottom:1px solid #294574;background:linear-gradient(110deg,#152d54,#081124)}h1{font-size:23px;margin:0 0 5px}p{margin:0;color:#8fa7ce;max-width:920px}main{max-width:1500px;margin:auto;padding:18px}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button,select{background:#132847;border:1px solid #42628f;color:#d6e6ff;border-radius:4px;padding:9px 13px;font:inherit;cursor:pointer}a{color:#a3c8ff}canvas{display:block;width:100%;height:auto;background:#0c192c;border:1px solid #253b5c}#caption{padding:10px;color:#7e9cc6}small{font-size:12px;color:#8fa7ce}@media(max-width:600px){header{padding:18px}main{padding:10px}h1{font-size:20px}}</style></head><body><header><h1>SX슈트 · 원본과 동작 비교</h1><p>승인 원본과 각 자세를 같은 신체 기준 크기로 표시합니다. 머리·목의 연결, 골반–무릎–발목의 길이, 대검의 직선과 색감을 이펙트 없이 확인합니다. 웅크린 자세를 화면 높이에 맞춰 늘리지 않습니다.</p></header><main><nav><a href="./">전투 연출 ↗</a><button id="prev">← 이전</button><select id="pose" aria-label="동작 프레임"></select><button id="next">다음 →</button><small>좌우 방향키로도 이동할 수 있습니다.</small></nav><canvas id="comparison" width="1600" height="1000"></canvas><div id="caption"></div></main><script type="module">
const m=await fetch('manifest.json').then(r=>r.json()),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),list=Object.entries(m.motion).flatMap(([key,b])=>b.frames.filter(f=>m.activeMotion.includes(key+':'+f.index))),select=document.querySelector('select'),img=src=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=src;}),source=await img(m.sourceArt),cache=new Map();
for(const [i,f]of list.entries()){const o=document.createElement('option');o.value=i;o.textContent=f.id;select.append(o);}
const requested=new URL(location.href).searchParams.get('pose'),requestedIndex=list.findIndex(f=>f.id===requested);if(requestedIndex>=0)select.value=requestedIndex;
let token=0;
async function render(){const ticket=++token,f=list[Number(select.value)];if(!cache.has(f.file))cache.set(f.file,img(f.file));const frame=await cache.get(f.file);if(ticket!==token)return;ctx.clearRect(0,0,1600,1000);ctx.fillStyle='#0c192c';ctx.fillRect(0,0,1600,1000);ctx.strokeStyle='#294464';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(800,80);ctx.lineTo(800,960);ctx.moveTo(45,910);ctx.lineTo(1555,910);ctx.stroke();ctx.font='500 28px system-ui';ctx.fillStyle='#b6d3ff';ctx.fillText('승인 원본',70,58);ctx.fillText(f.id+' · 연결 작화',855,58);const h=430,base=910,a=h/m.idle.bodyPixels,b=h/360;ctx.drawImage(source,350-m.idle.pivot.x*a,base-m.idle.pivot.y*a,source.width*a,source.height*a);ctx.drawImage(frame,1070-f.pivot.x*b,base-f.pivot.y*b,frame.width*b,frame.height*b);ctx.font='18px system-ui';ctx.fillStyle='#7b96bb';ctx.fillText('동일한 기준 신체 높이 · 전체 균일 배율 · 본체 색상 보정 없음',70,976);document.querySelector('#caption').textContent=f.id+' / '+f.source+(f.repairReason?' · 연결과 비율을 유지하도록 전신 재작화':'');}
select.onchange=render;function step(n){select.value=(Number(select.value)+n+list.length)%list.length;render();}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});await render();
</script></body></html>
