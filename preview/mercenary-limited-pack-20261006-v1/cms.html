<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리미티드팩 CMS 검수</title><link rel="stylesheet" href="/admin/mercenary-admin-v1.css"><link rel="stylesheet" href="/admin/mercenary-limited-admin-v1.css?v=20261006"><style>body{margin:0;padding:24px;background:#10141d;color:#eee;font-family:Arial,sans-serif}main{max-width:1160px;margin:auto}.qa-label{padding:14px;background:#312640;color:#dec693;font-size:13px}button{cursor:pointer}input,textarea{box-sizing:border-box}</style></head><body><main class="mc-admin"><div class="qa-label">CMS 검수 · 가상 설정 · 운영 저장 없음</div><div id="editor"></div></main><script type="module">import {createLimitedMercenaryEditor} from '/admin/mercenary-limited-admin-v1.js?v=20261006';import {previewState} from './fixture.mjs';let state=previewState();const host=document.querySelector('#editor'),render=()=>{host.innerHTML=editor.html();editor.mount(host.querySelector('[data-limited-root]'));};const editor=createLimitedMercenaryEditor({request:async options=>{if(options?.method==='PATCH'){const b=JSON.parse(options.body);state={...state,policy:b.policy,packSettings:b.packSettings,revision:state.revision+1,packRevision:state.packRevision+1};state.stock=state.stock.map(s=>({...s,limit:b.packSettings.stockLimits[s.code],remaining:b.packSettings.stockLimits[s.code]===null?null:b.packSettings.stockLimits[s.code]-s.issued}));}return structuredClone(state);},onRender:render});render();</script></body></html>
