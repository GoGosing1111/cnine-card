<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>APOCALYPSE BOSS SKILL FX V2</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,SUIT,"Noto Sans KR",system-ui,sans-serif;background:#030508;color:#eef2f5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 56%,#270406 0,#08070b 34%,#030508 72%);overflow:hidden}
    .stage{position:relative;width:min(100vw,1120px);min-height:min(100vh,760px);display:flex;align-items:center;justify-content:center;isolation:isolate;overflow:hidden;border:1px solid #2c171b;background:linear-gradient(180deg,rgba(2,5,9,.3),rgba(2,3,6,.96)),radial-gradient(ellipse at 50% 75%,#381014 0,#09080b 50%,#020305 80%);box-shadow:0 30px 100px #000}
    .stage:before{content:"";position:absolute;inset:56% -15% -26%;transform:perspective(540px) rotateX(62deg);background:repeating-linear-gradient(90deg,rgba(130,28,37,.14) 0 1px,transparent 1px 72px),repeating-linear-gradient(0deg,rgba(130,28,37,.12) 0 1px,transparent 1px 58px);mask-image:linear-gradient(#fff,transparent)}
    .announcement{position:fixed;z-index:4;top:clamp(34px,8vh,76px);right:auto;bottom:auto;left:50%;transform:translateX(-50%);min-width:min(86vw,520px);padding:14px 28px 15px;text-align:center;opacity:0;border-block:1px solid rgba(255,76,82,.78);background:linear-gradient(90deg,transparent,rgba(38,3,7,.86) 16%,rgba(38,3,7,.86) 84%,transparent);filter:drop-shadow(0 8px 16px #000);transition:opacity .16s ease}
    .announcement.is-visible{opacity:1}
    .announcement small{display:block;color:#ff6069;font-size:11px;font-weight:900;letter-spacing:.32em}
    .announcement strong{display:block;margin-top:5px;font-size:clamp(24px,5vw,42px);font-weight:950;letter-spacing:.08em;text-shadow:0 0 18px rgba(255,38,50,.38)}
    .effect{position:relative;z-index:2;width:min(90vw,760px);aspect-ratio:512/455;margin-top:80px;filter:drop-shadow(0 18px 32px rgba(0,0,0,.82));transform-origin:50% 74%}
    canvas{display:block;width:100%;height:100%}
    .effect.is-impact{animation:impact 148ms cubic-bezier(.2,.8,.2,1)}
    .flash{position:absolute;z-index:5;inset:0;pointer-events:none;background:#fff;opacity:0;mix-blend-mode:screen}
    .flash.is-active{animation:flash 50ms linear}
    .controls{position:absolute;z-index:6;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:14px}
    button{min-width:154px;border:1px solid #c52f39;border-radius:4px;padding:13px 22px;background:linear-gradient(#7f1119,#3f070b);color:#fff;font:800 14px/1 inherit;letter-spacing:.08em;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.4)}
    button:hover{filter:brightness(1.14)}
    .status{font-size:11px;color:#8f9aa4;letter-spacing:.08em;white-space:nowrap}
    @keyframes impact{0%,100%{transform:translate(0,0) scale(1)}18%{transform:translate(-7px,4px) scale(1.035)}48%{transform:translate(6px,-3px) scale(.99)}72%{transform:translate(-3px,2px) scale(1.01)}}
    @keyframes flash{0%{opacity:0}.1%{opacity:.14}100%{opacity:0}}
    @media(max-width:640px){.stage{min-height:100vh;border:0}.effect{width:112vw;margin-top:36px}.announcement{top:62px}.controls{bottom:34px;flex-direction:column;gap:8px}.status{font-size:10px}}
    @media(prefers-reduced-motion:reduce){.effect.is-impact,.flash.is-active{animation:none}.announcement{transition:none}}
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="아포칼립스 보스 스킬 이펙트 검수">
    <div class="announcement" id="announcement" aria-live="polite"><small>APOCALYPSE SKILL</small><strong>종말 집행</strong></div>
    <div class="effect" id="effect"><canvas id="canvas" width="512" height="455"></canvas></div>
    <div class="flash" id="flash"></div>
    <div class="controls"><button id="play" type="button">스킬 재생</button><span class="status" id="status">영상 없음 · 텍스트 + 전장 이펙트</span></div>
  </main>
  <audio id="audio" preload="auto" src="../../assets/sfx/v3-apocalypse-boss-ultimate-v1/boss-ultimate-combat-v2.mp3?v=1-apocalypse-runtime"></audio>
  <script>
    (()=>{
      const FRAME_COUNT=12,COLUMNS=4,FRAME_W=512,FRAME_H=455,FPS=17,COLLISION_FRAME=6;
      const atlas=new Image(),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:true});
      const announcement=document.getElementById('announcement'),effect=document.getElementById('effect'),flash=document.getElementById('flash'),status=document.getElementById('status'),audio=document.getElementById('audio'),button=document.getElementById('play');
      let run=0;
      atlas.src='../../assets/ui/project-v/fx/apocalypse-boss-ultimate-v2/boss-ultimate-impact-atlas-v2.png?v=2-low-afterimage';
      const draw=frame=>{ctx.clearRect(0,0,FRAME_W,FRAME_H);ctx.globalCompositeOperation='source-over';ctx.drawImage(atlas,(frame%COLUMNS)*FRAME_W,Math.floor(frame/COLUMNS)*FRAME_H,FRAME_W,FRAME_H,0,0,FRAME_W,FRAME_H)};
      const play=async()=>{
        if(!atlas.complete)await atlas.decode();
        const token=++run,start=performance.now(),duration=1000/FPS;
        button.disabled=true;announcement.classList.add('is-visible');status.textContent='재생 중 · 12F / 17FPS';
        try{audio.pause();audio.currentTime=0;audio.volume=.1;await audio.play()}catch{}
        let collisionPlayed=false;
        const tick=now=>{
          if(token!==run)return;
          const frame=Math.min(FRAME_COUNT-1,Math.floor((now-start)/duration));draw(frame);
          if(!collisionPlayed&&frame>=COLLISION_FRAME){collisionPlayed=true;effect.classList.remove('is-impact');flash.classList.remove('is-active');void effect.offsetWidth;effect.classList.add('is-impact');flash.classList.add('is-active')}
          if(frame<FRAME_COUNT-1){requestAnimationFrame(tick);return}
          setTimeout(()=>{if(token!==run)return;ctx.clearRect(0,0,FRAME_W,FRAME_H);announcement.classList.remove('is-visible');effect.classList.remove('is-impact');flash.classList.remove('is-active');button.disabled=false;status.textContent='영상 없음 · 텍스트 + 전장 이펙트'},140);
        };
        requestAnimationFrame(tick);
      };
      atlas.addEventListener('load',()=>draw(0),{once:true});
      button.addEventListener('click',play);
      window.__APOCALYPSE_FX_PREVIEW__={play,contract:{frames:FRAME_COUNT,fps:FPS,collisionFrame:COLLISION_FRAME,fullscreenVideo:false,blendMode:'normal',audioVolume:.1}};
    })();
  </script>
</body>
</html>
