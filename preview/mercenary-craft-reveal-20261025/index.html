<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>용병 제작 연출 검수</title>
<link rel="stylesheet" href="/css/mercenary-craft-reveal-v1.css?v=20261025-v4">
<style>body{background:#08111c;color:#edf3ff;font:15px system-ui,sans-serif;margin:24px}button,select{font:inherit;padding:8px;margin:4px}</style>
<p>용병 제작 연출 검수 · 실제 제작과 같은 연출입니다. 재료 소모·계정 지급은 없습니다.</p>
<select id="mercenary" aria-label="제작 용병"><option value="WORKSHOP_JOKRO">족로</option><option value="WORKSHOP_KAIRON">카이론</option></select>
<button type="button" id="success">성공 연출</button><button type="button" id="failure">실패 연출</button>
<script src="/js/mercenary-craft-reveal-v1.js?v=20261025-v4"></script>
<script type="module">
import {MERCENARY_CRAFTS} from '/shared/mercenary-craft-v1.mjs';
const show=success=>{const def=MERCENARY_CRAFTS.find(d=>d.recipeCode===document.querySelector('select').value);
  const recipe={output_name:def.art.name,output_image:'/'+def.art.sourceArt,materials:[{image_url:'/assets/items/mercenary-sss-card-shard-v1.png'}]};
  window.MercenaryCraftReveal.play({recipe,data:{ok:true,requestId:'visual-sample-only',category:'MERCENARY_CRAFT',success,recipeName:def.name,coinSpent:1e12,masterStarSpent:def.code==='V-979'?1e7:1e6,output:success?{name:def.art.name,image:'/'+def.art.sourceArt,quantity:1}:null}});
};
document.querySelector('#success').onclick=()=>show(true);document.querySelector('#failure').onclick=()=>show(false);
const demo=new URLSearchParams(location.search).get('demo');if(['success','failure'].includes(demo))show(demo==='success');
</script>
</html>
