<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나무늘봉순 · 조은 | 리미티드 용병 시안</title>
<style>
@font-face{font-family:ReviewKR;src:url('../../assets/fonts/lich-raid/NotoSansKR-lich-v1.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#080f17;color:#edf3f7;font-family:ReviewKR,sans-serif;background-image:radial-gradient(ellipse at 8% 0%,#25313f 0,transparent 48%),radial-gradient(ellipse at 92% 40%,#092b36 0,transparent 45%)}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #72e6ec;outline-offset:4px}
header{max-width:1120px;margin:auto;padding:36px 28px 24px;display:flex;align-items:end;justify-content:space-between;gap:24px}.eyebrow{color:#acc7d4;font-size:12px;letter-spacing:.18em;margin:0 0 10px}h1{font-size:28px;letter-spacing:-.05em;margin:0}header p:last-child{font-size:13px;color:#a4b5c2;margin:10px 0 0}
nav{display:flex;gap:4px;background:#101a24;padding:5px;border:1px solid #2c3945;border-radius:8px;flex-shrink:0}nav button{color:#a7bac9;border:0;border-radius:5px;background:transparent;padding:10px 13px;font-size:13px}nav button[aria-pressed="true"]{background:#d6e5ed;color:#0e1b27}
main{max-width:1120px;margin:auto;padding:0 28px 30px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:26px}.entry{min-width:0;background:#111b26;border:1px solid #34414c;border-radius:12px;overflow:hidden;box-shadow:0 22px 65px #0005}.entry.neon{border-color:#245362}.caption{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.caption h2{font-size:20px;letter-spacing:-.04em;margin:0}.caption p{font-size:12px;color:#a8bdc8;margin:5px 0 0}.rank{font-size:12px;color:#e9d3a4;border:1px solid #665b40;padding:6px 9px;border-radius:5px;white-space:nowrap}.neon .rank{color:#8de8ec;border-color:#376a71}
.painting{position:relative;aspect-ratio:2/3;width:100%;margin:auto;background:#0b111b;cursor:zoom-in}.painting .art{display:block;width:100%;height:100%;object-fit:contain}.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}body[data-mode="frame"] .frame{display:block}.foot{padding:14px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;color:#9ab0be}.foot a{color:#cbdce6;text-decoration:none;border-bottom:1px solid #577685}
body[data-mode="small"] .painting{width:160px}body[data-mode="small"] .entry{padding-bottom:12px}body[data-mode="small"] .caption{padding-bottom:16px}.note{color:#93aab9;font-size:12px;line-height:1.8;margin:22px 2px 0}.note a{color:#b9d7e3}
dialog{padding:18px;border:1px solid #506471;border-radius:12px;background:#0b141e;color:white;max-width:95vw;max-height:96vh}dialog::backdrop{background:#030910df;backdrop-filter:blur(8px)}dialog img{display:block;max-width:88vw;max-height:85vh;object-fit:contain}dialog button{position:absolute;right:26px;top:26px;background:#0b141edc;color:white;border:1px solid #93aab9;padding:8px 13px;border-radius:6px}
@media(max-width:700px){header{padding:26px 18px 20px;align-items:start;flex-direction:column;gap:18px}h1{font-size:25px}nav{width:100%}nav button{flex:1}main{padding:0 18px 26px}.gallery{grid-template-columns:1fr;gap:22px}.caption{padding:15px 17px}.caption h2{font-size:20px}.foot{padding:13px 17px}.note{font-size:12px}}
</style>
</head>
<body data-mode="raw">
<header><div><p class="eyebrow">LIMITED MERCENARY · CONCEPT ART</p><h1>설원의 봉순, 네온의 조은</h1><p>예상 등급 SS · 봉순 얼굴·콘셉트·의상 채택 · 조은 재설계</p></div><nav aria-label="원화 보기 방식"><button data-mode="raw" aria-pressed="true">원화</button><button data-mode="frame" aria-pressed="false">카드 프레임</button><button data-mode="small" aria-pressed="false">160px</button></nav></header>
<main><div class="gallery">
<article class="entry"><div class="caption"><div><h2>나무늘봉순</h2><p>설원의 특수부대 · 은백·금색 돌격소총</p></div><span class="rank">SS 예상</span></div><div class="painting" role="button" tabindex="0" aria-label="나무늘봉순 원화 확대"><img class="art" src="assets/bongsoon-snow-source-art-v2.png" alt="긴 다리와 슬렌더한 체형으로 수정한 설원 특수부대 나무늘봉순"><img class="frame" src="../../assets/ui/card-frames/mercenary-contract-frame-slim-v3.png" alt=""></div><div class="foot"><span>다리·체형 수정본</span><a href="assets/bongsoon-snow-source-art-v2.png" target="_blank">원본 PNG ↗</a></div></article>
<article class="entry neon"><div class="caption"><div><h2>조은</h2><p>흑백 특수부대 · 네온 장비 총기</p></div><span class="rank">SS 예상</span></div><div class="painting" role="button" tabindex="0" aria-label="조은 원화 확대"><img class="art" src="assets/joeun-neon-source-art-v2.png" alt="첨부 사진의 얼굴을 참고하고 새로운 자세와 시점으로 제작한 조은"><img class="frame" src="../../assets/ui/card-frames/mercenary-contract-frame-slim-v3.png" alt=""></div><div class="foot"><span>전면 재설계 대상 · 반려 기록</span><a href="assets/joeun-neon-source-art-v2.png" target="_blank">원본 PNG ↗</a></div></article>
</div><p class="note">원화를 누르면 크게 볼 수 있습니다. 예상 SS는 검토 기준이며, 두 원화는 시안입니다. <a href="references/faces-bongsoon-left-joeun-right.png" target="_blank">얼굴 참고</a> · <a href="prompts.json" target="_blank">제작 프롬프트</a></p></main>
<dialog aria-label="원화 확대"><button>닫기</button><img alt="확대한 용병 원화"></dialog>
<script>
const dialog=document.querySelector('dialog'),large=dialog.querySelector('img');
document.querySelectorAll('nav button').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.mode=button.dataset.mode;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
document.querySelectorAll('.painting').forEach(panel=>{const open=()=>{large.src=panel.querySelector('.art').src;large.alt=panel.querySelector('.art').alt;dialog.showModal()};panel.addEventListener('click',open);panel.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});
dialog.querySelector('button').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script></body></html>
