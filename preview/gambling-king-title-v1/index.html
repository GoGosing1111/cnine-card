<!doctype html>
<html lang="ko">
<head>

  <style>
    *{box-sizing:border-box}body{margin:0;background:#05070e;color:#c9c5d5;font-family:Pretendard,'Noto Sans KR',sans-serif}
    .preview-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:#101019;border-bottom:1px solid #363043;font-size:12px}

    @media(max-width:620px){.preview-bar{padding:10px 12px;font-size:11px}.preview-names{padding:18px 12px;gap:16px}}

</head>
<body>
  <div class="preview-bar"><span>도박왕 · 승부예측 1,000회 적중</span><div class="preview-actions"><button id="callingCard" type="button">명함에서 보기</button><a id="viewMode" href="?locked=1">획득 전 보기</a></div></div>

    <div><span class="public-title-badge title-style-gambling_king">[도박왕]</span><b>숲켓몬</b></div>
    <div><span class="public-title-badge title-style-trophy_hunter">[우승청부사]</span><b>트로피헌터</b></div>
  </div>
  <script src="../../js/character-loadout-v2.js"></script>
  <script src="../../js/player-card-v2052.js"></script>
  <script src="preview.js?power=60000"></script>
