<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050a11">
  <title>PROJECT V · 전직 스킬 연출 프리뷰</title>
  <link rel="stylesheet" href="./preview.css?v=3">
</head>
<body>
  <main class="preview-shell">
    <header class="preview-header">
      <div>
        <p class="eyebrow">PROJECT V · ISOLATED ORIGINAL FX AUDITION</p>
        <h1>전직 스킬 연출 프리뷰</h1>
      </div>
      <div class="status" id="status" aria-live="polite">신규 전직 아틀라스 로딩 중</div>
    </header>

    <section class="stage-wrap" aria-label="전직 스킬 연출 재생 영역">
      <div id="pixiStage" class="pixi-stage"></div>
      <div class="target-caption" aria-hidden="true">
        <span>IMPACT TARGET</span>
        <strong id="effectTitle">자동 순차 재생</strong>
      </div>
      <div id="screenFlash" class="screen-flash" aria-hidden="true"></div>
    </section>

    <nav class="controls" aria-label="전직 스킬 선택">
      <button type="button" data-class="SHATTER"><span>SHATTER</span><strong>공격 · 홍련 용각성</strong></button>
      <button type="button" data-class="RIPOSTE"><span>RIPOSTE</span><strong>반격자</strong></button>
      <button type="button" data-class="AFTERIMAGE"><span>AFTERIMAGE</span><strong>속도 · 시공매 각성</strong></button>
      <button type="button" data-class="IMMORTAL"><span>IMMORTAL</span><strong>힐 · 세계수 개화</strong></button>
    </nav>

    <footer class="preview-footer">
      <span>PixiJS WebGL</span><span>GSAP frame clock</span><span>50ms white flash</span><span>역할별 단일 각성 atlas + recorded SFX V1</span>
    </footer>
  </main>
  <script src="./advancement-fx-preview.bundle.js?v=3"></script>
</body>
</html>
