<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계급 프리뷰 모바일 검수</title><style>html,body{margin:0;background:#060a11;color:#d5e0ef;font:13px system-ui}header{padding:14px;display:flex;gap:12px;align-items:center}button{background:#15233a;color:#eee;border:1px solid #466082;min-height:44px;padding:8px 18px;cursor:pointer}iframe{display:block;max-width:100%;height:calc(100dvh - 75px);border:1px solid #4a5d79;margin:auto}</style><header>검수 너비 <button data-width="390">390px</button><button data-width="320">320px</button></header><iframe id="phone" title="모바일 계급 검수" src="./index.html" width="390"></iframe><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>document.getElementById('phone').width=b.dataset.width));</script></html>
