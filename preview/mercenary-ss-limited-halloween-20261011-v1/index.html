<script type="module">
const gallery = document.querySelector('#gallery');
const dialog = document.querySelector('#lightbox');
let manifest;
const element = (tag, className, text) => {const node = document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
const link = (text, href) => {const node=element('a',null,text);node.href=href;node.target='_blank';node.rel='noopener';return node};
function makePainting(character) {
  const reference = document.body.dataset.mode === 'reference';
  const artPath = reference ? character.referenceArt : character.sourceArt;
  const painting = element(artPath ? 'button' : 'div','painting');
  if (!artPath) {const empty=element('div','empty');empty.append(element('strong',null,'새 포즈 준비 중'),element('span',null,'새 원화가 연결되면 이곳에 표시됩니다.'));painting.append(empty);return painting;}
  painting.type='button';painting.setAttribute('aria-label',`${character.name} ${reference?'기존 승인':'할로윈'} 원화 확대`);
  const window=element('div','art-window'),art=element('img','art');art.src=artPath;art.alt=`${character.name} · ${reference?'기존 승인 원화':character.concept}`;art.loading='lazy';art.decoding='async';window.append(art);painting.append(window);
  const frame=element('img','frame');frame.src=manifest.frame.path;frame.alt='';frame.loading='lazy';painting.append(frame);
  painting.addEventListener('click',()=>{document.querySelector('#lightbox-title').textContent=`${character.name} · ${reference?'기존 승인 원화':character.concept}`;const zoom=painting.cloneNode(true);zoom.removeAttribute('type');zoom.removeAttribute('aria-label');zoom.querySelector('.art').loading='eager';document.querySelector('#lightbox-art').replaceChildren(zoom);dialog.showModal()});
  return painting;
}
function render() {
  gallery.replaceChildren();
  for(const character of manifest.characters) {
    const entry=element('article','entry'),caption=element('div','caption'),title=element('div');
    title.append(element('h2',null,character.name),element('p',null,character.concept));
    const approved=character.status==='APPROVED_SOURCE_ART';
    caption.append(title,element('span',`status${approved?'':' pending'}`,approved?'원화 승인':character.sourceArt?'새 포즈 검수':'새 포즈 준비'));
    const foot=element('div','foot');
    foot.append(character.sourceArt?link(`원본 PNG · V${character.sourceArtVersion??3} ↗`,character.sourceArt):element('span',null,'조은·디임 이전 시안 제외'),link('얼굴·체형 참고 ↗',character.referenceArt));
    entry.append(caption,makePainting(character),foot);gallery.append(entry);
  }
}
for(const button of document.querySelectorAll('.view-modes button'))button.addEventListener('click',()=>{document.body.dataset.mode=button.dataset.mode;for(const other of document.querySelectorAll('.view-modes button'))other.setAttribute('aria-pressed',String(other===button));if(manifest)render()});
document.querySelector('#close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
try {
  if(location.protocol==='file:') manifest=JSON.parse(document.querySelector('#gallery-data').textContent);
  else {const response=await fetch('./manifest.json',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);manifest=await response.json();}
  const approved=manifest.characters.filter(c=>c.status==='APPROVED_SOURCE_ART').length;
  const pending=manifest.characters.length-approved;
  document.querySelector('#summary').textContent=`${approved}종 원화 승인 · ${pending}종 새 포즈${manifest.characters.some(c=>c.status!=='APPROVED_SOURCE_ART'&&c.sourceArt)?' 검수':' 제작'} · 얼굴·체형·작화를 비교할 수 있습니다.`;
  render();
} catch(error) {
  document.querySelector('#summary').textContent='원화 목록을 불러오지 못했습니다.';
  const message=element('div','error','manifest.json을 읽을 수 없습니다. 프로젝트 로컬 미리보기 서버에서 이 페이지를 열어 주세요.');message.append(document.createElement('br'),link('파일 목록 보기 ↗','manifest.json'));gallery.append(message);console.error(error);
}
</script>
