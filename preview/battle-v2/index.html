<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>마법카드 V2 · 실전 전투 프리뷰</title>

<body class="battle-v2-preview-page">
  <aside class="live-preview-console" aria-label="마법카드 V2 프리뷰 조작부">
    <button class="live-preview-console-toggle" type="button" aria-expanded="true" aria-controls="livePreviewConsoleBody">
      <span><i></i> LIVE V2</span><b>마법카드 프리뷰</b>
    </button>
    <div id="livePreviewConsoleBody" class="live-preview-console-body">
      <p>본게임과 동일한 전투 계산·카드 프레임·발동 이펙트 리소스를 사용합니다. 아래 카드를 누르면 해당 효과만 즉시 확인할 수 있습니다.</p>
      <label>마법카드 구성
        <select id="magicPreviewMode">
          <option value="EXAMPLES" selected>CMS 예시 7종 전체</option>
          <option value="LOADOUT">내 실제 PVP 장착 덱</option>
        </select>
      </label>
      <div class="live-preview-actions">
        <button id="magicPreviewReplay" type="button">같은 전투 다시 보기</button>
        <button id="magicPreviewReroll" type="button">새 전투 계산</button>
      </div>
      <div id="magicPreviewStatus" class="live-preview-status">전투 데이터를 준비하고 있습니다.</div>
      <div id="magicPreviewCards" class="live-preview-card-strip"></div>
      <a href="/admin/" class="live-preview-admin-link">CMS로 돌아가기</a>
    </div>
  </aside>
  <div id="battleV2PreviewModal" aria-live="polite"></div>
  <script src="/js/battle-v2-live.js?v=1663-magic-effect-resources"></script>
  <script src="./live-preview.js?v=1663-magic-effect-resources"></script>
