<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>붕괴 코어 · 봉인된 전리품 V2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="./reward-preview.css"><link rel="preload" as="image" href="./assets/observatory-vault-v2.png"></head>
<body><main class="preview-home"><span class="eyebrow">CORE PROTOCOL · REWARD SEQUENCE V2</span><h1>봉인된 전리품</h1><p>세 개의 봉인, 단 하나의 선택.<br>보관함을 눌러 전리품을 확인하세요.</p><div class="preview-settings"><label>시연 보상<select id="sample"><option value="mercenary">용병 · 오메가-X</option><option value="star">마스터의 별</option><option value="coin">코인</option><option value="material">재료 · 별빛 방어구 코어</option></select></label><label>재생 속도<select id="speed"><option value="1">기본 속도</option><option value="0.5">천천히 · 0.5배</option></select></label></div><button id="play" type="button">연출 재생</button><footer>시연 수량은 운영 설정과 무관합니다. 실제 보상은 지급되지 않습니다.</footer><p id="error" role="status"></p></main>
<script type="module">
import {showCoreRewardPickerV2} from './picker.mjs';
const samples={mercenary:{rewardType:'MERCENARY',name:'오메가-X',rarity:'SSS',quantity:1,image:'assets/ui/project-v/mercenaries/mercenary-v021-omega-x-source-art-v1.jpg'},star:{rewardType:'MASTER_STAR',name:'마스터의 별',quantity:100},coin:{rewardType:'COIN',name:'코인',quantity:100000000},material:{rewardType:'INVENTORY_ITEM',name:'별빛 방어구 코어',quantity:1,image:'assets/items/starlight-armor-core-v1749.png'}};
const button=document.getElementById('play');
async function play(){button.disabled=true;document.getElementById('error').textContent='';try{const reward=samples[document.getElementById('sample').value];await showCoreRewardPickerV2({speed:Number(document.getElementById('speed').value),offer:{offerId:'PREVIEW-ONLY',selectedIndex:null,baseReward:{coin:10000000000}},claim:async({selectedIndex})=>{await new Promise(resolve=>setTimeout(resolve,280));return {selectedIndex,reward:{coin:10000000000},choiceReward:reward};}});}catch(error){document.getElementById('error').textContent=error.message;}finally{button.disabled=false;}}
button.onclick=()=>void play();if(!new URL(location.href).searchParams.has('manual'))void play();
</script></body></html>
