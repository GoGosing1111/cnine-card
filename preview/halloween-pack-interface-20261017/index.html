<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리버스콜 · 할로윈 UI 시연</title><link rel="stylesheet" href="/css/mercenary-halloween-pack-v2.css?v=20261017-auto-v1"><style>
body{margin:0;background:#060915;color:#eee3d3;font-family:'Noto Sans KR',sans-serif}.review-head{max-width:1180px;margin:20px auto 8px;padding:0 16px;box-sizing:border-box}.review-head h1{font-size:21px;margin:0 0 8px}.review-head p{font-size:13px;color:#c8b5c8;line-height:1.7;margin:0}.review-nav{display:flex;flex-wrap:wrap;gap:5px;max-width:1180px;margin:auto;padding:0 12px}.review-nav button{width:155px;font-size:12px}.review-nav button[aria-pressed=true]{background-image:url('/assets/ui/packs/halloween-interface-20261017/button-ember.webp')}.review-link{font-size:12px;color:#e7c79c;display:block;margin:0 0 15px}.hwp-preview{position:relative;max-height:none;margin:0 auto 24px;overflow:visible}.hwp-preview .hwp-header{position:static}.hwp-preview .hwp-actions{position:static}.hwp-preview .hwp-confirm{position:relative;min-height:560px}.hwp-preview .hwp-confirm[hidden]{display:none}.hwp-preview .hwp-film{max-width:760px;margin:20px auto}.hwp-preview .hwp-reveal{display:block}.hwp-preview video{display:block}.hwp-preview .hwp-status{color:#f3be87}@media(max-width:600px){.review-head{margin-top:14px}.review-head h1{font-size:18px}.review-nav{gap:0;padding:0 6px}.review-nav button{width:33.33%;min-height:54px;padding:10px 16px;font-size:11px}.hwp-preview .hwp-confirm{min-height:480px}}
</style></head><body><header class="review-head"><h1>할로윈팩 · 화면 시연</h1><p>판매 OFF · 계정 연결 없음 · 실제 추첨·차감·지급 없음</p><a class="review-link" href="/?screen=buy">라이브 카드상점으로</a></header><nav class="review-nav" aria-label="시연 화면"><button class="hwp-button" data-view="room">계약실</button><button class="hwp-button" data-view="auto">자동뽑기</button><button class="hwp-button" data-view="confirm">구매 확인</button><button class="hwp-button" data-view="results">10회 결과</button><button class="hwp-button" data-view="ss">SS 영상</button><button class="hwp-button" data-view="sss">SSS 영상</button></nav><section id="room" class="hwp-dialog hwp-preview" aria-label="할로윈팩 화면 시연"></section><script type="module">
import {HALLOWEEN_PACK} from '/shared/mercenary-halloween-pack-v1.mjs';
import {HALLOWEEN_PACK_CARDS} from '/shared/mercenary-halloween-pool-v3.mjs?v=20261017-harlequin-v980';
import {halloweenRoomMarkup,halloweenCollectionMarkup,halloweenResultsMarkup} from '/js/mercenary-halloween-presentation-v2.mjs?v=20261017-auto-v1';
import {MERCENARY_CINEMATICS} from '/js/mercenary-acquisition-video.mjs?v=2145';
const host=document.querySelector('#room'),$=s=>host.querySelector(s);let liveStock=[];
function render(mode){
 host.querySelector('video')?.pause();host.innerHTML=halloweenRoomMarkup(HALLOWEEN_PACK);host.dataset.resultCount=mode==='results'?'10':'';
 $('[data-hwp-status]').textContent='화면 시연 · 실제 개봉 결과가 아닙니다.';
 $('[data-hwp-close]').onclick=()=>render('room');$('[data-hwp-recover]').disabled=true;$('[data-hwp-auto-toggle]').onclick=()=>render('auto');if(mode==='auto'){$('[data-hwp-auto-panel]').hidden=false;$('[data-hwp-auto-quote]').textContent='화면 시연 · 실제 추첨·차감 없음';$('[data-hwp-auto-start]').disabled=true;}
 $('[data-hwp-roster]').innerHTML=halloweenCollectionMarkup(HALLOWEEN_PACK_CARDS,liveStock);
 document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===mode)));
 if(mode==='confirm'){
  $('[data-hwp-shell]').hidden=true;$('[data-hwp-confirm]').hidden=false;$('[data-hwp-confirm-text]').textContent='가격 미정 · 판매 OFF';
  $('[data-hwp-confirm-start]').disabled=true;$('[data-hwp-confirm-start]').textContent='시연 화면';$('[data-hwp-confirm-cancel]').onclick=()=>render('room');
 }else if(mode==='results'){
  $('[data-hwp-off]').hidden=true;$('[data-hwp-collection]').hidden=true;$('[data-hwp-reveal]').hidden=false;
  $('[data-hwp-result-total]').textContent='10장 동시 공개 · 시연';
  const rows=Array.from({length:10},(_,i)=>{const c=HALLOWEEN_PACK_CARDS[i%9];return {rank:c.rank,name:c.name,mercenaryCode:c.code,artUrl:'/'+c.displayArt,limited:true,serial:'—'};});
  $('[data-hwp-results]').innerHTML=halloweenResultsMarkup(rows,HALLOWEEN_PACK.image);
  host.querySelectorAll('.hwp-result>small').forEach(node=>node.textContent='시연 · 실제 지급 없음');
 }else if(mode==='ss'||mode==='sss'){
  const rank=mode.toUpperCase();$('[data-hwp-off]').hidden=true;$('[data-hwp-collection]').hidden=true;$('[data-hwp-reveal]').hidden=false;$('.hwp-result-area').hidden=true;
  $('[data-hwp-film]').hidden=false;$('[data-hwp-video]').hidden=false;$('[data-hwp-film-rank]').textContent=rank+' 영상 시연';
  const video=document.createElement('video');video.src=MERCENARY_CINEMATICS[rank].src;video.controls=true;video.muted=true;video.playsInline=true;video.preload='metadata';$('[data-hwp-video]').replaceChildren(video);video.play().catch(()=>{});
  $('.hwp-film>p').textContent='하이퍼팩과 같은 원본 영상입니다. 실제 획득 결과는 없습니다.';
 }
}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>render(button.dataset.view));render('room');
// Public, read-only stock; no account, purchase or receipt API is used in this preview.
fetch('/api/mercenary-halloween-pack/config',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Stock unavailable');return r.json();}).then(data=>{liveStock=data.stock||[];const roster=$('[data-hwp-roster]');if(roster)roster.innerHTML=halloweenCollectionMarkup(HALLOWEEN_PACK_CARDS,liveStock);}).catch(()=>{});
</script></body></html>
