<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>핑두의 금도끼 은도끼 · 10월 2일–8일 · 숲켓몬</title>
<style>
@font-face{font-family:PosterTitle;src:url('../../assets/fonts/clan-camp/BlackHanSans-Regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:PosterBody;src:url('../../assets/fonts/lich-raid/NotoSansKR-lich-v1.woff2') format('woff2');font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#051a20}body{display:flex;justify-content:center;font-family:PosterBody,"Malgun Gothic",sans-serif}
.poster{margin:0;position:relative;isolation:isolate;width:min(100vw,1024px);aspect-ratio:2/3;overflow:hidden;container-type:inline-size;color:#fff7e2}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}
.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(2,13,24,.35),rgba(2,13,24,.2) 23%,transparent 30%,transparent 75%,rgba(2,19,27,.6) 86%,rgba(1,15,22,.88))}
.edge{position:absolute;inset:1.65%;border:1px solid rgba(227,196,135,.34);pointer-events:none;z-index:-1}
.brand{position:absolute;top:3%;left:0;width:100%;text-align:center}
.brand-name{margin:0;font-family:PosterTitle,sans-serif;font-size:3.85cqw;line-height:1.16;letter-spacing:.025em;color:#fff4d8;text-shadow:0 .2cqw .55cqw #062333}
.kicker{margin:1.2cqw 0 0;font-size:1.65cqw;font-weight:650;letter-spacing:.25em;color:#e7d3a8}
.title-block{position:absolute;top:10.7%;left:0;width:100%;text-align:center}
.host{margin:0 0 1cqw;font-family:PosterTitle,sans-serif;font-size:4.8cqw;line-height:1.18;letter-spacing:.01em;color:#ffe7d5;text-shadow:0 .25cqw .75cqw #061421}
h1{margin:0;display:flex;justify-content:center;align-items:center;gap:2.8cqw;font-family:PosterTitle,sans-serif;font-weight:400;font-size:12.5cqw;line-height:1.14;letter-spacing:-.05em;filter:drop-shadow(0 .4cqw .2cqw #061422) drop-shadow(0 0 1.5cqw #071b2c)}
h1 span{display:block;padding:.15em .04em .2em}
.gold{background:linear-gradient(#fffbe5 5%,#fff0ab 28%,#ffd065 58%,#e1a332 100%);background-clip:text;-webkit-background-clip:text;color:transparent}
.silver{background:linear-gradient(#fff 5%,#effbff 28%,#c6e7fc 65%,#a3c4e3 100%);background-clip:text;-webkit-background-clip:text;color:transparent}
.period{position:absolute;left:6%;right:6%;bottom:5.4%;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 .22cqw .65cqw #00171f}
.period:before{content:"";display:block;width:58%;height:1px;margin-bottom:2.5cqw;background:linear-gradient(90deg,transparent,#e8ce91 22%,#e8ce91 78%,transparent)}
.duration{margin:0 0 1.25cqw;display:flex;align-items:center;gap:1.1cqw;font-weight:850;font-size:3.1cqw;letter-spacing:.02em;color:#fff1c7}
.duration::before,.duration::after{content:"";height:1px;width:3.5cqw;background:#d1bb80}
.dates{margin:0;color:#fff8e9;font-weight:850;font-size:5.25cqw;line-height:1.45;letter-spacing:-.035em;white-space:nowrap}
.year{margin:.9cqw 0 0;color:#c9dfe0;font-size:1.65cqw;letter-spacing:.23em;font-weight:650}
</style>
</head>
<body>
<main class="poster" aria-label="숲켓몬 핑두의 금도끼 은도끼 이벤트 포스터. 2026년 10월 2일부터 10월 8일까지, 단 7일간.">
<img class="art" src="./artwork-v1.png" alt="달빛 연못 위의 핑크 가면 라이더 핑두와 금도끼, 은도끼">
<div class="shade" aria-hidden="true"></div><div class="edge" aria-hidden="true"></div>
<header class="brand"><p class="brand-name">숲켓몬</p><p class="kicker">기간 한정 이벤트</p></header>
<section class="title-block" aria-label="이벤트 이름"><p class="host">핑두의</p><h1><span class="gold">금도끼</span><span class="silver">은도끼</span></h1></section>
<footer class="period"><p class="duration">단 7일간</p><p class="dates">10월 2일 ~ 10월 8일</p><p class="year">2026</p></footer>
</main>
</body>
</html>
