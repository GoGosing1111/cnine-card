<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>이름 미정 · SSS 전투 시연</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./preview.css"></head>
<body><main>
<header class="masthead"><div><p class="eyebrow">PROJECT V <span>SSS</span></p><h1>관통의 화살</h1><p class="intro">이름 미정 · 전투 리소스 시연</p></div><div class="head-action"><span class="version">ARROW / 02</span><button id="showcase" class="primary" disabled>전체 시연</button></div></header>
<section class="theater"><div class="stage-heading"><span id="cue">화살과 시위를 준비하는 중</span><span class="status" id="health">전투 리소스 준비 중</span></div>
<div class="battle-viewport"><iframe src="./battle.html?v=arrow-v2" title="이름 미정 V3 전투 재생" allow="autoplay" id="battle-frame"></iframe></div>
<div class="scrubber"><input id="scrub" type="range" min="0" max="5.4" step=".001" value="0" aria-label="재생 위치" disabled><output id="time">0.00 / 5.40초</output></div>
<div class="controls"><div class="transport"><button id="play" disabled>재생</button><button id="restart" disabled>처음부터</button><button id="impact" disabled>타격 순간</button><button id="cancel" disabled>중단</button></div><label>속도 <select id="speed" disabled><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label class="check"><input id="sound" type="checkbox" disabled>무음 검수</label><label class="check"><input id="focus" type="checkbox" disabled>용병 확대</label><label class="check"><input id="effects" type="checkbox" checked disabled>이펙트</label><label class="check"><input id="motion-only" type="checkbox" disabled>동작만</label><label class="check"><input id="reduced" type="checkbox" disabled>동작 줄이기</label></div>
</section>
<nav class="mode-tabs" aria-label="전투 동작"><button data-mode="idle" aria-pressed="true" disabled><small>01 / READY</small><strong>전투 대기</strong><span>고정 자세 · 시위 정렬</span></button><button data-mode="dash" disabled><small>02 / DASH</small><strong>질풍보</strong><span>빠른 전진 · 자세 회복</span></button><button data-mode="attack" disabled><small>03 / SHOT</small><strong>파갑 관통</strong><span>시위 충전 · 관통 사격</span></button><button data-mode="skill" disabled><small>04 / SKILL</small><strong>연환 파갑</strong><span>고속 연사 · 일곱 화살</span></button><button data-mode="ultimate" disabled><small>05 / ULTIMATE</small><strong>천궁 멸진</strong><span>화살비 · 거대 화살</span></button><button data-mode="hit" disabled><small>06 / HIT</small><strong>피격</strong><span>충격 흡수 · 회복</span></button><button data-mode="defeat" disabled><small>07 / DEFEAT</small><strong>쓰러짐</strong><span>무릎 · 정착</span></button></nav>
<section class="details"><figure class="portrait"><img src="./assets/source-art-preview.webp" alt="이름 미정의 기준 원화"><figcaption>SSS <span>승인 원화 보존</span></figcaption></figure><div class="sequence"><p class="eyebrow">SEQUENCE</p><h2 id="description">화살로 진형을 꿰뚫는 적금의 궁사</h2><ol id="events"></ol><div class="advanced"><label>검수 상황 <select id="scenario" disabled><option value="normal">정상 재생</option><option value="interrupt">시전 중단</option><option value="lost">대상 소멸</option></select></label><select id="mode" aria-label="동작 선택" hidden><option value="idle">전투 대기</option><option value="dash">질풍보</option><option value="attack">파갑 관통</option><option value="skill">연환 파갑</option><option value="ultimate">천궁 멸진</option><option value="hit">피격</option><option value="defeat">쓰러짐</option></select><a href="./manifest.json" target="_blank">리소스 색인 ↗</a></div></div></section>
<footer>전투 리소스 검수판 · 스킬명은 연출 구분용 가칭 · 최종 시각 승인 및 운영 연결 전</footer>
</main></body></html>
