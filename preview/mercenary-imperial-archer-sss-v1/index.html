<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>이름 미정 · SSS 전투 시연</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./preview.css"></head>
<body><main>
<header class="masthead"><div><p class="eyebrow">PROJECT V <span>SSS</span></p><h1>주작의 가호</h1><p class="intro">이름 미정 · 전투 리소스 시연</p></div><div class="head-action"><span class="version">VERMILION / 01</span><button id="showcase" class="primary" disabled>전체 시연</button></div></header>

</section>
<nav class="mode-tabs" aria-label="전투 동작"><button data-mode="aura" aria-pressed="true" disabled><small>01 / AURA</small><strong>주작의 가호</strong><span>주작의 날개 · 상시 아우라</span></button><button data-mode="dash" disabled><small>02 / DASH</small><strong>적영보</strong><span>깃털 잔영 · 이동</span></button><button data-mode="attack" disabled><small>03 / SHOT</small><strong>금우 관통</strong><span>시위 충전 · 관통 사격</span></button><button data-mode="skill" disabled><small>04 / SKILL</small><strong>주작비상</strong><span>주작 현신 · 연속 관통</span></button><button data-mode="ultimate" disabled><small>05 / ULTIMATE</small><strong>주작천강</strong><span>천공 화살진 · 주작 강림</span></button><button data-mode="hit" disabled><small>06 / HIT</small><strong>피격</strong><span>충격 흡수 · 회복</span></button><button data-mode="defeat" disabled><small>07 / DEFEAT</small><strong>쓰러짐</strong><span>무릎 · 정착</span></button></nav>
