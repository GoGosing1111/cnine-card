<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영토전 리뉴얼 · 신규 전술</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif;color:#edf4f4;background:#080f18}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;gap:22px;align-items:end;margin-bottom:24px}small{color:#dabf7d;letter-spacing:.2em}h1{font-size:clamp(28px,4vw,44px);margin:9px 0}p{color:#a5b8c7;line-height:1.7;margin:0}a{color:#efcf86;text-underline-offset:4px}.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.skill{position:relative;text-align:left;min-height:160px;padding:23px 32% 23px 24px;border:1px solid #344958;border-radius:4px;background:#10212b;color:#f4f5f1;overflow:hidden;cursor:pointer}.skill img{position:absolute;right:-10px;top:0;width:48%;height:100%;object-fit:contain;opacity:.94;pointer-events:none}.skill b{display:block;font-size:20px;position:relative;margin:10px 0}.skill span,.skill em{font-size:13px;color:#becdd2;font-style:normal;position:relative;line-height:1.6}.skill[data-skill="DISRUPTION_WAVE"]{background:#1b1831;border-color:#504267}.skill[data-skill="CITADEL_REPAIR"]{background:#102b25;border-color:#2a5b4c}.skill:hover{border-color:#d8bb7c}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.controls button,.controls select{font:inherit;background:#192a38;border:1px solid #3a5364;color:#eef4f6;border-radius:4px;padding:9px 16px;cursor:pointer}.controls output{margin-left:auto;color:#ddc383;font-size:13px}iframe{display:block;border:1px solid #344957;width:100%;height:810px;background:#080f18}.poster{margin:35px auto;max-width:640px}.poster img{width:100%;display:block}.poster p{text-align:center;padding:14px;font-size:14px}footer{padding:20px 0;color:#9eafbc;font-size:13px}@media(max-width:700px){main{padding:18px 12px}header{display:block}.skills{grid-template-columns:1fr;gap:8px}.skill{min-height:120px;padding:15px 35% 15px 18px}.skill img{width:36%}.skill b{margin:6px 0}.controls output{width:100%;margin:4px 0}iframe{height:830px}.poster{margin-top:25px}}
</style></head><body><main>
<header><div><small>리버스콜 · TERRITORY WAR</small><h1>다시 전장으로 !</h1><p>9개 거점, 세 갈래 전선. 공격·교란·재건으로 달라지는 전황.</p></div><a href="assets/territory-renewal-poster-v1.png" download>리뉴얼 포스터 저장 ↗</a></header>
<section class="skills" aria-label="신규 전술">
<button class="skill" data-skill="ARC_LANCE"><img src="/assets/ui/territory-war/renewal-skills-v1/arc-lance-icon.webp" alt=""><span>01 / 공격</span><b>천뢰 관통포</b><em>전력 40 · 적 최대 HP 6% 타격</em></button>
<button class="skill" data-skill="DISRUPTION_WAVE"><img src="/assets/ui/territory-war/renewal-skills-v1/disruption-wave-icon.webp" alt=""><span>02 / 교란</span><b>동력 교란파</b><em>선택 거점의 적 전력 최대 35 감소</em></button>
<button class="skill" data-skill="CITADEL_REPAIR"><img src="/assets/ui/territory-war/renewal-skills-v1/citadel-repair-icon.webp" alt=""><span>03 / 지원</span><b>성채 재건</b><em>방벽 8% 복구 · 전력 +20</em></button>
</section>
<div class="controls"><label>진영 <select id="side"><option value="A">수호</option><option value="B">정화</option></select></label><button data-control="pause">일시정지</button><button data-control="resume">계속 재생</button><button data-control="speed" data-value="0.5">0.5배속</button><button data-control="speed" data-value="1">정상 속도</button><button data-control="stop">정지</button><output id="status">검수 전장 준비 중…</output></div>
<iframe id="battle" title="영토전 신규 전술 검수 전장"></iframe>
<p style="margin-top:12px;font-size:13px">스킬 이름을 눌러 연출을 재생합니다. 검수용 전장으로 운영 계정과 보상에는 영향을 주지 않습니다.</p>
<section class="poster"><img src="assets/territory-renewal-poster-v1.png" alt="영토전 리뉴얼 다시 전장으로 포스터"><p>개인 균형 편성 · 아군 전용 지휘 · 신규 전술 3종</p></section>
<footer><a href="poster-prompt.json">포스터 제작 기록</a> · <a href="fx-prompts.json">효과 제작 기록</a></footer></main>
<script>
const frame=document.getElementById('battle'),status=document.getElementById('status');
async function prepare(){const win=frame.contentWindow;for(let i=0;i<160;i++){if(typeof win.openTerritoryWar==='function')break;await new Promise(r=>setTimeout(r,100))}await win.openTerritoryWar();for(let i=0;i<160;i++){const node=win.document.querySelector('[data-tw4-node="4"]');if(node){node.click();break}await new Promise(r=>setTimeout(r,100))}for(let i=0;i<80;i++){const entry=win.document.querySelector('.tw6-map-entry');if(entry){entry.click();break}await new Promise(r=>setTimeout(r,100))}status.textContent='25명 투표 · 스킬별 45분 쿨타임';win.document.getElementById('qaTerritoryOpen')?.remove();}
if(location.hostname==='127.0.0.1'){frame.addEventListener('load',()=>prepare().catch(()=>status.textContent='로컬 영토전 검수 서버에서 열어 주세요.'));frame.src='/';}else{frame.hidden=true;frame.style.display='none';status.textContent='연출 재생은 로컬 영토전 검수 서버에서 이용할 수 있습니다.';}
document.querySelectorAll('[data-skill]').forEach(button=>button.onclick=async()=>{const api=frame.contentWindow.CNineTerritoryBattlefield;if(!api)return;api.previewControl('stop');await api.playPreview(button.dataset.skill,document.getElementById('side').value);status.textContent=button.querySelector('b').textContent+' 재생';});
document.querySelectorAll('[data-control]').forEach(button=>button.onclick=()=>frame.contentWindow.CNineTerritoryBattlefield?.previewControl(button.dataset.control,Number(button.dataset.value)||undefined));
</script></body></html>
