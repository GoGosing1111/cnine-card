<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#171c2d">
  <title>오리꿍 — 숲켓몬 아바타</title>
  <link rel="stylesheet" href="./style.css?v=1">
  <script src="./preview.js?v=1" defer></script>
</head>
<body>
  <main>
    <header class="page-heading">
      <div><p class="eyebrow">SOOPKETMON / AVATAR COLLECTION</p><h1>오리꿍 <span>ORIKKUNG</span></h1></div>
      <p class="review-status"><i aria-hidden="true"></i> 제니스 카드 기반 · A-15</p>
    </header>
    <div class="art-grid">
      <section class="art-panel" aria-labelledby="lobby-heading">
        <div class="panel-heading"><h2 id="lobby-heading"><span>01</span> 로비 일러스트</h2><span class="format">2:3 · 1024 × 1536</span></div>
        <div class="art-stage lobby-stage">
          <img src="./assets/avatar-orikkung-lobby-v1-1024.webp" srcset="./assets/avatar-orikkung-lobby-v1-640.webp 640w, ./assets/avatar-orikkung-lobby-v1-1024.webp 1024w" sizes="(max-width:680px) 100vw,45vw" width="1024" height="1536" alt="하늘색과 백색 머리, 꽃 장식과 흰색·청록색 의상을 살린 오리꿍 로비 일러스트." fetchpriority="high">
        </div>
        <footer><span>푸른 조명의 음악 라운지.</span><a href="./assets/avatar-orikkung-lobby-source-art-v1.png" target="_blank" rel="noopener">원본 보기 <span aria-hidden="true">↗</span></a></footer>
      </section>
      <section class="art-panel" aria-labelledby="equipment-heading">
        <div class="panel-heading"><h2 id="equipment-heading"><span>02</span> 장비창 전신</h2><span class="format">RGBA · 투명 PNG</span></div>
        <div class="art-stage equipment-stage" id="equipment-stage" data-background="dark">
          <span class="stage-label" aria-hidden="true">EQUIPMENT AVATAR</span>
          <img src="./assets/avatar-orikkung-equipment-v1-640.webp" width="640" height="960" alt="오리꿍 장비창용 투명 전신. 얼굴과 의상, 선 자세를 유지하고 배경만 제거했습니다.">
        </div>
        <footer class="equipment-footer">
          <div class="background-controls" role="group" aria-label="투명 배경 검수">
            <button type="button" data-background="dark" aria-pressed="true">어두운 배경</button>
            <button type="button" data-background="light" aria-pressed="false">밝은 배경</button>
          </div>
          <a href="./assets/avatar-orikkung-equipment-source-art-v1.png" target="_blank" rel="noopener">투명 원본 보기 <span aria-hidden="true">↗</span></a>
        </footer>
      </section>
    </div>
    <p class="page-note">제니스 오리꿍 카드의 얼굴·헤어·의상 특징을 바탕으로 제작했습니다. <a href="./README.md">제작 기록</a> · <a href="./prompt.md">생성 프롬프트</a></p>
  </main>

</html>
