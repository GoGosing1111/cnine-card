<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>봉인전 UI 검수</title><link rel="stylesheet" href="/css/seal-battle.css"><style>body{margin:0;background:#080c17;color:#f3f5ff;font-family:'Noto Sans KR',sans-serif}main{max-width:1240px;margin:auto;padding:20px}.preview-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;padding:8px 0 18px;color:#a9b8cf}.preview-toolbar select{padding:9px;background:#111828;color:white;border:1px solid #41516b}.pve-mode-tabs{display:none}.modal{display:none}.modal.show{display:flex;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;background:#03070df0}@media(max-width:620px){main{padding:10px}}</style><main><div class="preview-toolbar"><b>봉인전 UI · 검수용 예시 데이터</b><label>상태 <select id="scenario"><option value="active">진행 중</option><option value="complete">봉인 완료</option><option value="failed">실패</option><option value="no-charge">도전 횟수 없음</option><option value="no-deck">덱 미편성</option><option value="empty">미운영</option><option value="offline">조회 실패</option></select></label></div><div class="pve-mode-tabs"></div><div id="pveRaidView" hidden></div></main><div id="modal" class="modal"></div><script src="fixture.js"></script><script src="/js/seal-battle.js"></script><script>window.addEventListener('DOMContentLoaded',()=>{document.querySelector('[data-seal-battle-mode]').click();document.querySelector('#scenario').onchange=()=>document.querySelector('[data-seal-battle-mode]').click();});</script></html>
