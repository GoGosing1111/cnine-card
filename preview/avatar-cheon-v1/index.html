<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#191718">
  <title>체온 — 숲켓몬 아바타</title>
  <link rel="stylesheet" href="./style.css?v=1">
  <script src="./preview.js?v=1" defer></script>
</head>
<body>
  <main>
    <header class="page-heading">
      <div><p class="eyebrow">SOOPKETMON / AVATAR COLLECTION</p><h1>체온 <span>CHEON</span></h1></div>
      <p class="review-status"><i aria-hidden="true"></i> A-14 · 신규 아바타</p>
    </header>
    <div class="art-grid">
      <section class="art-panel" aria-labelledby="lobby-heading">
        <div class="panel-heading"><h2 id="lobby-heading"><span>01</span> 로비 일러스트</h2><span class="format">2:3 · 1024 × 1536</span></div>
        <div class="art-stage lobby-stage">
          <img src="./assets/avatar-cheon-lobby-v1-1024.webp" srcset="./assets/avatar-cheon-lobby-v1-640.webp 640w, ./assets/avatar-cheon-lobby-v1-1024.webp 1024w" sizes="(max-width: 680px) 100vw, 45vw" width="1024" height="1536" alt="체온 로비용 전신 일러스트. 긴 갈색 머리, 검은 상의와 차콜 팬츠, 따뜻한 조명의 라운지." fetchpriority="high">
        </div>
        <footer><span>따뜻한 조명, 차분한 실루엣.</span><a href="./assets/avatar-cheon-lobby-source-art-v1.png" target="_blank" rel="noopener">원본 보기 <span aria-hidden="true">↗</span></a></footer>
      </section>
      <section class="art-panel" aria-labelledby="equipment-heading">
        <div class="panel-heading"><h2 id="equipment-heading"><span>02</span> 장비창 전신</h2><span class="format">RGBA · 투명 PNG</span></div>
        <div class="art-stage equipment-stage" id="equipment-stage" data-background="dark">
          <span class="stage-label" aria-hidden="true">EQUIPMENT AVATAR</span>
          <img src="./assets/avatar-cheon-equipment-v1-640.webp" width="640" height="960" alt="체온 장비창용 전신. 배경을 제거하고 얼굴·의상·포즈를 유지한 투명 이미지.">
        </div>
        <footer class="equipment-footer">
          <div class="background-controls" role="group" aria-label="투명 배경 검수">
            <button type="button" data-background="dark" aria-pressed="true">어두운 배경</button>
            <button type="button" data-background="light" aria-pressed="false">밝은 배경</button>
          </div>
          <a href="./assets/avatar-cheon-equipment-source-art-v1.png" target="_blank" rel="noopener">투명 원본 보기 <span aria-hidden="true">↗</span></a>
        </footer>
      </section>
    </div>
    <p class="page-note">CMS → 아바타 관리 → A-14 체온. 이미지 등록 완료 · 지급·판매·능력치는 별도 설정입니다.</p>
  </main>
</body>
</html>
