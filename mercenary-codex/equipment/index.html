<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1420"><meta name="color-scheme" content="dark">
  <title>용병 장비 · 리버스콜</title>
  <link rel="stylesheet" href="./style.css?v=20261105-mercenary-v2">
</head>
<body>
<a class="skip" href="#storage">장비 보관함으로 이동</a>
<header class="topbar">
  <button class="ui-button icon-button" id="back" aria-label="뒤로가기" data-icon="back"></button>
  <a class="brand" href="/?screen=home">리버스콜</a>
  <span class="location">용병 <span aria-hidden="true">/</span> 장비</span>
  <nav aria-label="게임 메뉴"><a class="ui-button" href="/mercenary-codex/?view=owned">용병도감</a><a class="ui-button" href="/?screen=home">로비로</a></nav>
</header>
<main class="shell">
  <div class="page-title"><div><h1>용병 장비</h1><p>용병마다 장비를 선택하고 착용하세요.</p></div><p class="preview-label">용병별 장비 <span>· 변경 즉시 저장</span></p></div>
  <div id="loadStatus" class="load-status panel" role="status"><strong>용병과 장비를 불러오는 중입니다.</strong><div class="loading-bars" aria-hidden="true"><i></i><i></i><i></i></div></div>
  <div id="workspace" class="workspace" hidden>
    <aside class="roster panel" aria-label="내 용병 선택">
      <div class="section-heading"><h2>내 용병</h2><span id="mercCount"></span></div>
      <label class="search-box"><span data-icon="search"></span><input id="mercSearch" type="search" placeholder="용병 이름 검색" aria-label="용병 이름 검색" maxlength="80"></label>
      <div id="mercList" class="merc-list"></div>
      <p class="roster-note">용병을 선택해도<br>전투 편성은 바뀌지 않습니다.</p>
    </aside>
    <section class="armory panel" aria-labelledby="mercName">
      <button id="mobileMerc" class="ui-button mobile-merc" aria-haspopup="dialog"><span>용병 변경</span><span data-icon="people"></span></button>
      <div class="merc-heading"><div><h2 id="mercName"></h2><p id="mercMeta"></p></div><div class="modes" role="group" aria-label="장비를 적용할 전장"><button class="ui-button" data-mode="PVE" aria-pressed="true">PVE</button><button class="ui-button" data-mode="PVP" aria-pressed="false">PVP</button></div></div>
      <div class="stage"><button id="openArt" class="portrait-button" aria-haspopup="dialog"><img id="portrait" src="/assets/ui/mercenary-codex/command-20261021/panel-v3.webp" alt="은설 원화"><span class="art-hint"><span data-icon="expand"></span>원화 보기</span></button><div id="slots" class="slots" role="group" aria-label="장비 부위 선택"></div></div>
      <div class="equipped-summary"><span id="slotCount"></span><button class="text-button" id="clearSlot">모든 부위 보기</button></div>
      <div class="power-summary"><div><span id="powerLabel"></span><small>장비가 더하는 전투력</small></div><strong id="gearPower"></strong></div>
      <details class="set-effects" open><summary>세트 효과 <span id="setCount"></span></summary><div id="setEffects"></div></details>
      <button class="ui-button inventory-jump" id="inventoryJump">장비 보관함 보기<span data-icon="down"></span></button>
    </section>
    <section id="storage" class="storage panel" aria-labelledby="storageTitle" tabindex="-1">
      <div class="section-heading"><h2 id="storageTitle">장비 보관함</h2><button class="ui-button icon-button" id="refresh" aria-label="장비 새로고침" data-icon="refresh"></button></div>
      <div class="storage-tabs" role="group" aria-label="보유 장비와 장비 도감"><button class="ui-button" data-view="owned" aria-pressed="true">보유 장비 <span id="ownedCount"></span></button><button class="ui-button" data-view="catalog" aria-pressed="false">장비 도감 <span id="catalogCount"></span></button></div>
      <label class="search-box"><span data-icon="search"></span><input id="gearSearch" type="search" placeholder="장비 이름 검색" aria-label="장비 이름 검색" maxlength="80"></label>
      <div class="filters"><label><span class="sr-only">장비 부위</span><select id="slotFilter"><option value="">모든 부위</option><option value="WEAPON">무기</option><option value="TOP">상의</option><option value="BOTTOM">하의</option><option value="SHOES">신발</option><option value="ACCESSORY">장신구</option></select></label><label><span class="sr-only">착용 상태</span><select id="ownerFilter"><option value="">착용 전체</option><option value="free">미착용</option><option value="self">선택 용병</option><option value="other">다른 용병</option></select></label><label><span class="sr-only">장비 정렬</span><select id="sortFilter"><option value="default">기본순</option><option value="power">표시 전투력순</option><option value="name">표시 이름순</option></select></label></div>
      <div class="list-caption"><span id="listContext"></span><span id="resultCount" role="status"></span></div>
      <div id="gearList" class="gear-list" aria-label="장비 목록"></div>
      <button id="loadMore" class="ui-button" hidden>장비 더 불러오기</button><div id="inspectionHome"><section id="inspection" class="inspection" aria-label="선택 장비 비교"></section></div>
    </section>
  </div>
  <footer class="footer"><p>장비 한 개는 한 용병만 착용할 수 있습니다.</p><p id="saveStatus" role="status">장착 변경은 계정에 저장됩니다.</p></footer><button id="pendingRetry" class="ui-button primary" hidden>이전 저장 결과 확인</button>
</main>
<dialog id="gearDialog" class="sheet panel" aria-labelledby="gearDialogTitle"><header><h2 id="gearDialogTitle">장비 비교</h2><button class="ui-button icon-button" data-close="gearDialog" aria-label="장비 비교 닫기" data-icon="close"></button></header><div id="gearDialogBody"></div></dialog>
<dialog id="mercDialog" class="sheet panel" aria-labelledby="mercDialogTitle"><header><h2 id="mercDialogTitle">용병 선택</h2><button class="ui-button icon-button" data-close="mercDialog" aria-label="용병 선택 닫기" data-icon="close"></button></header><div id="mobileMercList"></div></dialog>
<dialog id="confirmDialog" class="confirm-dialog panel" aria-labelledby="confirmTitle"><header><h2 id="confirmTitle">장비 이동 확인</h2><button class="ui-button icon-button" data-close="confirmDialog" aria-label="장비 이동 취소" data-icon="close"></button></header><div id="confirmBody"></div><div class="confirm-actions"><button class="ui-button" data-close="confirmDialog">취소</button><button class="ui-button primary" id="confirmMove">장비 이동</button></div></dialog>
<dialog id="artDialog" class="art-dialog panel" aria-labelledby="artTitle"><header><h2 id="artTitle">용병 원화</h2><button class="ui-button" data-close="artDialog">닫기</button></header><img id="fullArt" src="/assets/ui/mercenary-codex/command-20261021/panel-v3.webp" alt="은설 원화"></dialog>
<div id="toast" class="toast panel" role="status" aria-live="polite" hidden></div>
<noscript><p>장비를 확인하려면 JavaScript를 켜 주세요.</p></noscript>
<script type="module" src="./app.mjs?v=20261105-mercenary-v2"></script>
</body></html>
