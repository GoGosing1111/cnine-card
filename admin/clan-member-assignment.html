<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>클랜 인원 편입 · OWNER CMS</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1119;color:#edf5ff}
    *{box-sizing:border-box}body{margin:0;padding:32px 16px}main{max-width:760px;margin:auto;border:1px solid #334252;background:#121d29;border-radius:16px;padding:28px}
    a{color:#89d8ee}h1{font-size:26px;margin:22px 0 12px}p{line-height:1.65;color:#aebfd2}label{display:block;margin:20px 0 8px;font-weight:700}
    input,select,button{font:inherit;border:1px solid #526779;border-radius:8px;padding:14px;width:100%;background:#09121d;color:inherit}button{cursor:pointer;margin-top:18px;font-weight:700;background:#24465e}button:disabled{opacity:.45;cursor:default}#apply{background:#256154}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.7;border:1px solid #425365;padding:18px;border-radius:8px}#status{min-height:28px}#status[data-error=true]{color:#ffb2b2}fieldset{border:0;padding:0;margin:0}
    [hidden]{display:none!important}:focus-visible{outline:3px solid #95e7ff;outline-offset:3px}
  </style>
  <script type="module" src="./clan-member-assignment.js"></script>
</head>
<body><main>
  <a href="./">← CMS로 돌아가기</a>
  <h1>클랜 인원 편입</h1>
  <p>OWNER 전용 · 현재 시즌의 무소속 계정을 빈자리에 편입합니다. 기존 멤버 탈퇴, 정원 변경, 보상 지급은 실행하지 않습니다. 2차 인증과 랭크전 덱은 서버에서 확인합니다.</p>
  <p id="owner">관리자 인증 확인 중…</p>
  <form id="assignment-form">
    <fieldset id="fields" disabled>
      <label for="nickname">정확한 계정 닉네임</label>
      <input id="nickname" required maxlength="80" autocomplete="off">
      <label for="clan">편입할 클랜</label>
      <select id="clan" required><option value="">클랜 선택</option></select>
      <button type="submit" id="preview">계정·소속·정원 확인</button>
    </fieldset>
  </form>
  <p id="status" role="status" aria-live="polite">화면을 여는 것만으로 편입되지 않습니다.</p>
  <pre id="details" hidden></pre>
  <button id="apply" type="button" hidden disabled>확인한 계정 편입</button>
</main></body>
</html>
